<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="main-heading">welcome to CFS</h1>
    <p class="desc">spark 4.0 java full stack</p>
    <p class="desc">SuperOps 1.0 devops</p>
    
    <div>
        <h2 id="title">DSA</h2>
        <p class="content">DSA course</p>
    </div>

    <ul class="list">
        <li>java</li>
        <li>HTML</li>
        <li>js</li>
    </ul>

    <button id="btn">click Me</button>

    <div id="demo">
        hello <strong>worls</strong>
    </div>

    <script>
        // fetchin tags from html
        const heading = document.getElementById("main-heading");
        console.log(heading.innerText);

        const para = document.getElementsByClassName("desc")[0];
        console.log(para.length);
        
        console.log(para[0].innerHTML);
        console.log(para[1].innerHTML);

        const btn = document.getElementById("btn");
        console.log(btn.innerText);

        // select all list items using tag name
        const listItem = document.getElementsByTagName("li");
        for(let items of listItem){
            console.log(items.textContent);
        }

        // query selector
        const des = document.querySelectorAll(".desc");
        des.forEach((p, index) => {
            console.log(p.innerText); 
        });

        // innertext : gives you only visible text inside the element
        // innerHTML : gives you entire html content (including nested tags inside and element) - not just text

        const ele=document.getElementById("demo");
        console.log("innerText ", ele.innerText);
        console.log("innerHTML ", ele.innerHTML);
        


    </script>
  </body>
</html>
