<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h2>Edit profile</h2>

    <input type="text" id="imageInput" placeholder="Enter new image URL" />
    <button onClick="updateProfile"></button>
    <div id="profilecard" class="card">
        <img
        id="profilePic"

        alt=""
        width="100"
        />
        <h3 id="profileName">Vanshika</h3>
        <p id="profileBio">Full Stack Developers</p>
    </div>

    <script>
       function updateProfile(){
        const name = document.getElementById("nameInput").value;
        const bio = document.getElementById("bioInput").value;
        const img = document.getElementById("imageInput").value;

        console.log(img);
        
        document.getElementById("profileName").innerText=name;
        document.getElementById("profileBio").innerText=bio;
        document.getElementById("profileName").innerText=name;
       }
    </script>

    <style>
        .card {
            border: 20px solid #ccc;
            padding: 15px;
            width: 200px;
            margin-top: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</body>
